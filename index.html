<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Tasks</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 48px 20px; background: #eef2f8; color: #18243c; font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 640px; margin: auto; background: white; padding: 32px; border-radius: 24px; box-shadow: 0 16px 60px #18243c12; }
.eyebrow { color: #4353bb; font-weight: 700; letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
h1 { margin: 8px 0; font-size: 36px; }
p { color: #57647b; }
form { display: flex; gap: 10px; margin-top: 28px; }
input[type=text] { min-width: 0; flex: 1; padding: 13px; border: 1px solid #a4aec2; border-radius: 10px; font: inherit; }
button { border: 0; border-radius: 10px; padding: 12px 16px; font: inherit; cursor: pointer; background: #4353bb; color: white; }
button:hover { background: #303e98; }
:focus-visible { outline: 3px solid #d98000; outline-offset: 3px; }
ul { list-style: none; padding: 0; }
li { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e5e9f1; padding: 14px 0; }
li label { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
li span { overflow-wrap: anywhere; }
input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; accent-color: #4353bb; }
.done span { text-decoration: line-through; color: #68758b; }
.delete { background: #f5e9ec; color: #932641; font-size: 14px; }
.delete:hover { background: #efd2da; }
#status { font-size: 14px; }
footer { margin-top: 28px; font-size: 13px; color: #68758b; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 420px) { main { padding: 22px; } form { flex-wrap: wrap; } form button { width: 100%; } }
</style>
</head>
<body>
<main>
<div class="eyebrow">One step at a time</div>
<h1>Daily Tasks</h1>
<p>A little space to organize your day.</p>
<form id="task-form">
<label for="task-input" class="sr-only">New task</label>
<input id="task-input" type="text" placeholder="What needs to get done?" maxlength="200" required autocomplete="off">
<button type="submit">Add task</button>
</form>
<p id="status" role="status"></p>
<ul id="tasks" aria-label="Your tasks"></ul>
<p id="empty">Your list is clear. Add a task to get started.</p>
<footer>Saved in this browser. No account needed.</footer>
</main>
<script>
'use strict';
const storageKey = 'daily-tasks-v1';
const form = document.querySelector('#task-form');
const input = document.querySelector('#task-input');
const list = document.querySelector('#tasks');
const status = document.querySelector('#status');
let tasks = [];
let storageAvailable = true;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
  if (Array.isArray(saved)) {
    tasks = saved.filter(task => task && typeof task.id === 'string' &&
      typeof task.text === 'string' && typeof task.done === 'boolean');
  }
} catch { storageAvailable = false; }
function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(tasks));
    storageAvailable = true;
  } catch { storageAvailable = false; }
}
function render() {
  list.replaceChildren();
  for (const task of tasks) {
    const row = document.createElement('li');
    row.classList.toggle('done', task.done);
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = task.done;
    const text = document.createElement('span');
    text.textContent = task.text;
    checkbox.addEventListener('change', () => {
      task.done = checkbox.checked;
      row.classList.toggle('done', task.done);
      save();
      updateStatus();
    });
    label.append(checkbox, text);
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'delete';
    remove.textContent = 'Delete';
    remove.setAttribute('aria-label', 'Delete task: ' + task.text);
    remove.addEventListener('click', () => {
      tasks = tasks.filter(item => item.id !== task.id);
      save();
      render();
      input.focus();
    });
    row.append(label, remove);
    list.append(row);
  }
  updateStatus();
}
function updateStatus() {
  const remaining = tasks.filter(task => !task.done).length;
  status.textContent = remaining + ' remaining · ' + tasks.length + ' total' +
    (storageAvailable ? '' : ' — Browser storage unavailable; changes may not survive a reload.');
  document.querySelector('#empty').hidden = tasks.length > 0;
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text, done: false });
  save();
  render();
  form.reset();
  input.focus();
});
render();
</script>
</body>
</html>
